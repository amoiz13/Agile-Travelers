    Trip:
      type: object
      properties:
        duration:
          type: string
          description: Total trip duration in ISO 8601 format
          example: "PT1H30M"
        transferCount:
          type: integer
          description: Number of transfers required
          example: 0
        Origin:
          $ref: '#/components/schemas/TripEndpoint'
        Destination:
          $ref: '#/components/schemas/TripEndpoint'
        LegList:
          type: object
          properties:
            Leg:
              type: array
              items:
                $ref: '#/components/schemas/Leg'

    TripEndpoint:
      type: object
      properties:
        name:
          type: string
          example: "Stockholm Centralstation"
        type:
          type: string
          example: "ST"
        id:
          type: string
          example: "740000001"
        extId:
          type: string
          example: "740000001"
        date:
          type: string
          example: "2026-09-21"
        time:
          type: string
          example: "12:00:00"
        lat:
          type: number
          example: 59.330136
        lon:
          type: number
          example: 18.058151

    Leg:
      type: object
      properties:
        id:
          type: string
          example: "leg-01"
        name:
          type: string
          example: "SJ Snabbtåg 520"
        type:
          type: string
          description: JNY for public transit, WALK for walking, TRSF for transfer
          example: "JNY"
        category:
          type: string
          description: Transport mode category code (e.g. JST for high-speed train, BLT for local bus)
          example: "JST"
        dist:
          type: integer
          description: Distance in meters
          example: 71200
        duration:
          type: string
          example: "PT1H30M"
        Origin:
          $ref: '#/components/schemas/TripEndpoint'
        Destination:
          $ref: '#/components/schemas/TripEndpoint'
        Product:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        Notes:
          type: object
          properties:
            Note:
              type: array
              items:
                type: object
                properties:
                  value:
                    type: string
                    example: "Seat reservation required"

    Product:
      type: object
      properties:
        name:
          type: string
          example: "SJ Snabbtåg"
        operator:
          type: string
          example: "SJ"
        operatorCode:
          type: string
          example: "275"
        line:
          type: string
          example: "520"
        catOut:
          type: string
          example: "JST"
