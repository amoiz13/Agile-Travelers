openapi: 3.0.0
info:
  title: Trafiklab ResRobot API used in Agile Travelers
  description: >
    Interactive API documentation for Trafiklab ResRobot v2.1 endpoints
    used in the Agile Travelers application (Stop Lookup and Route Planner).
  version: 2.1.0
servers:
  - url: https://api.resrobot.se/v2.1
    description: ResRobot Production Server

paths:
  /location.name:
    get:
      summary: Search for stations or locations
      description: Returns a list of stops or coordinates matching the given search string.
      parameters:
        - name: accessId
          in: query
          required: true
          description: Your API Key
          schema:
            type: string
            example: "00000000-0000-0000-0000-000000000000"
        - name: input
          in: query
          required: true
          description: The search string. Append a question mark for fuzzy search.
          schema:
            type: string
            example: "Göteborg"
        - name: maxNo
          in: query
          required: false
          description: The maximum number of results to return, default 10, maximum 1000.
          schema:
            type: integer
            default: 10
            example: 10
        - name: lang
          in: query
          required: false
          description: Language (sv/en/de), default sv. Affects both data (names for different transport types) and error messages.
          schema:
            type: string
            enum: [sv, en, de]
            default: sv
            example: "sv"
        - name: format
          in: query
          required: false
          description: The response format, json or xml.
          schema:
            type: string
            enum: [json, xml]
            default: json
            example: "json"
      responses:
        '200':
          description: Successful stop lookup response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '401':
          description: Unauthorized (Invalid or missing API key)
        '500':
          description: Internal Server Error

  /trip:
    get:
      summary: Route planner (Trip search)
      description: Returns journey routes, transfers, modes of transport, and timetable details between an origin and destination.
      parameters:
        - name: accessId
          in: query
          required: true
          description: Your API key.
          schema:
            type: string
            example: "00000000-0000-0000-0000-000000000000"
        - name: originId
          in: query
          required: false
          description: Stop id to search a route from (retrieved from Stop lookup API). Either originId or originCoordLat+originCoordLong is required.
          schema:
            type: string
            example: "740000001"
        - name: originCoordLat
          in: query
          required: false
          description: Origin latitude (WGS84, decimal degree). Required if originId is omitted.
          schema:
            type: number
            example: 59.330136
        - name: originCoordLong
          in: query
          required: false
          description: Origin longitude (WGS84, decimal degree). Required if originId is omitted.
          schema:
            type: number
            example: 18.058151
        - name: destId
          in: query
          required: false
          description: Stop id to search a route to. Either destId or destCoordLat+destCoordLong is required.
          schema:
            type: string
            example: "740098001"
        - name: destCoordLat
          in: query
          required: false
          description: Destination latitude (WGS84, decimal degree). Required if destId is omitted.
          schema:
            type: number
            example: 57.708895
        - name: destCoordLong
          in: query
          required: false
          description: Destination longitude (WGS84, decimal degree). Required if destId is omitted.
          schema:
            type: number
            example: 11.973479
        - name: date
          in: query
          required: false
          description: Search on a specific date in YYYY-MM-DD format (default today).
          schema:
            type: string
            format: date
            example: "2026-09-21"
        - name: time
          in: query
          required: false
          description: Search on a specific time in HH:MM format (default now).
          schema:
            type: string
            example: "12:00"
        - name: searchForArrival
          in: query
          required: false
          description: Set to 1 to search for latest arrival date/time instead of first departure (0 = departure, 1 = arrival).
          schema:
            type: integer
            enum: [0, 1]
            default: 0
            example: 0
        - name: viaId
          in: query
          required: false
          description: Id of an additional stop that should be passed on the way.
          schema:
            type: string
            example: "740016365"
        - name: avoidId
          in: query
          required: false
          description: Id of a stop that should be avoided for transfers.
          schema:
            type: string
            example: "740000004"
        - name: numF
          in: query
          required: false
          description: Number of results to fetch departing after specified date/time (1-6, default 5).
          schema:
            type: integer
            default: 5
            example: 5
        - name: numB
          in: query
          required: false
          description: Number of results to fetch departing before specified date/time (0-5, default 0).
          schema:
            type: integer
            default: 0
            example: 0
        - name: maxChange
          in: query
          required: false
          description: Limits the maximum number of transfers (1-3, default unlimited).
          schema:
            type: integer
        - name: products
          in: query
          required: false
          description: Bitmask integer to filter transport products (train, bus, ferry, etc.).
          schema:
            type: integer
        - name: operators
          in: query
          required: false
          description: Comma-separated operator IDs to include or exclude (prefix with ! to exclude).
          schema:
            type: string
        - name: passlist
          in: query
          required: false
          description: Set to 1 to include passed intermediate stops on the route, 0 to omit.
          schema:
            type: integer
            enum: [0, 1]
            default: 0
            example: 0
        - name: originWalk
          in: query
          required: false
          description: Walking settings to first stop (allow,minDist,maxDist,walkSpeedPct).
          schema:
            type: string
        - name: destWalk
          in: query
          required: false
          description: Walking settings from last stop to destination (allow,minDist,maxDist,walkSpeedPct).
          schema:
            type: string
        - name: context
          in: query
          required: false
          description: Pagination context reference for scrolling up/down from prior search results.
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: Language (sv/en/de), default sv.
          schema:
            type: string
            enum: [sv, en, de]
            default: sv
            example: "sv"
        - name: format
          in: query
          required: false
          description: The response format, json or xml.
          schema:
            type: string
            enum: [json, xml]
            default: json
            example: "json"
      responses:
        '200':
          description: Successful route search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '401':
          description: Unauthorized (Invalid or missing API key)
        '500':
          description: Internal Server Error

components:
  schemas:
    LocationResponse:
      type: object
      description: Response object for Stop Lookup (/location.name)
      properties:
        StopLocation:
          type: array
          description: List of matched stop locations
          items:
            $ref: '#/components/schemas/StopLocation'
      example:
        StopLocation:
          - id: "740098001"
            extId: "740098001"
            name: "GÖTEBORG"
            lon: 11.973479
            lat: 57.708895
            weight: 22332
            products: 254

    StopLocation:
      type: object
      properties:
        id:
          type: string
          description: Internal stop id
          example: "740098001"
        extId:
          type: string
          description: External station ID (used for route planning)
          example: "740098001"
        name:
          type: string
          description: Stop or station name
          example: "GÖTEBORG"
        lon:
          type: number
          format: double
          description: Longitude in decimal degrees (WGS84)
          example: 11.973479
        lat:
          type: number
          format: double
          description: Latitude in decimal degrees (WGS84)
          example: 57.708895
        weight:
          type: integer
          description: Relevance/importance weight of the station
          example: 22332
        products:
          type: integer
          description: Bitmask representing available transport modes
          example: 254

    TripResponse:
      type: object
      description: Response object for Route Planning (/trip)
      properties:
        TripList:
          type: object
          properties:
            scrF:
              type: string
              description: Context scroll token for later journeys
              example: "scrF_token_example"
            scrB:
              type: string
              description: Context scroll token for earlier journeys
